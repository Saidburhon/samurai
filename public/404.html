<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Qilich</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@1&family=JetBrains+Mono&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap&text=%E5%89%A3" />
  <style>
    :root { --ink: #09090b; --text: #f3efe8; --muted: #9b978f; --shu: #ff3a24; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--ink); color: var(--text); font-family: "Archivo", system-ui, sans-serif; text-align: center; overflow: hidden; }
    .sun { position: fixed; width: min(70vmin, 560px); aspect-ratio: 1; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #ff3a24; opacity: .16; clip-path: polygon(0 0, 100% 0, 100% 42%, 0 58%); }
    .sun.b { clip-path: polygon(0 58%, 100% 42%, 100% 100%, 0 100%); transform: translate(-48%, -46%); }
    main { position: relative; display: grid; gap: 18px; justify-items: center; }
    .k { font-family: "Yuji Boku", serif; font-size: 96px; line-height: 1; color: var(--shu); }
    .code { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 72px); line-height: .95; font-weight: 800; font-stretch: 112%; letter-spacing: -.035em; }
    h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: var(--shu); }
    a { display: inline-flex; padding: 15px 24px; border-radius: 999px; background: var(--shu); color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div><div class="sun b" aria-hidden="true"></div>
  <main>
    <div class="k" aria-hidden="true">剣</div>
    <p class="code">404 · Page not found</p>
    <h1>This path was <em>cut.</em></h1>
    <a href="/">Back to Qilich</a>
  </main>
</body>
</html>
