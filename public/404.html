<style>
:root { --washi: #ECE6DA; --sumi: #0F0E0C; --kurogane: #2A2724; --shu: #D9381E; --m: clamp(20px, 2.78vw, 48px);
  --sans: QOkina, Geologica, 'Geologica Fallback', Arial, sans-serif; --mono: QOkinaMono, 'Martian Mono', 'Martian Fallback', monospace; --jp: 'Zen Old Mincho', serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--washi); }
body { min-height: 100svh; display: grid; grid-template-rows: 72px 1fr auto; color: var(--sumi); font: 380 17px/1.45 var(--sans); font-variation-settings: "SHRP" 30;
  background: var(--washi) var(--washi-tile, none) repeat 0 0 / 512px 512px; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--shu); outline-offset: 3px; }
header { display: flex; align-items: center; padding: 0 var(--m); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 24px; height: 24px; fill: currentColor; }
.brand span { font-weight: 600; font-variation-settings: "SHRP" 100; font-size: 14px; letter-spacing: .2em; }
main { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: clamp(24px, 3.4vw, 56px); padding: 0 var(--m); align-items: center; }
h1 { grid-column: 1; grid-row: 1; font-weight: 220; font-size: clamp(120px, 22vw, 320px); line-height: .8; letter-spacing: -.05em; font-variation-settings: "SHRP" 100; }
.plate { grid-column: 2; grid-row: 1; margin-right: 44px; } /* its own column: the tang never reaches the numeral, the tip stops short of the mei */
.plate img { width: 100%; height: auto; display: block; }
.mei { position: absolute; right: calc(var(--m) - 4px); top: 8%; font: 500 20px/1 var(--jp); writing-mode: vertical-rl; text-orientation: upright; letter-spacing: .16em; display: flex; gap: .55em; }
nav { display: flex; flex-wrap: wrap; gap: 12px 32px; padding: 32px var(--m) 40px; border-top: 1px solid rgba(15, 14, 12, .22); margin: 0 var(--m); padding-left: 0; padding-right: 0; }
nav a { font-size: 13px; font-weight: 560; letter-spacing: .08em; text-transform: uppercase; font-variation-settings: "SHRP" 60; padding: 6px 0; }
nav a:hover { font-variation-settings: "SHRP" 100; }
nav a[lang=ja] { font: 500 14px/1 var(--jp); letter-spacing: .12em; text-transform: none; } /* ホーム in the site's Mincho, as every Japanese word */
@media (aspect-ratio < 1.2), (max-width: 760px) {
  body { grid-template-rows: 60px 1fr auto; }
  main { grid-template-columns: 1fr; padding-top: 40px; }
  h1 { grid-column: 1; font-size: 34vw; }
  .plate { grid-column: 1; grid-row: 2; margin: 40px calc(-1 * var(--m)) 0; }
  .mei { top: 2%; font-size: 17px; }
}
